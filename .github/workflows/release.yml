name: Release

# Pushing a version tag (e.g. v0.6.2) builds both flavors signed with the release key and creates
# a draft GitHub Release with the APKs, to be reviewed and published by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.MOVINGDOTS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret MOVINGDOTS_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed APKs
        env:
          MOVINGDOTS_KEYSTORE: ${{ runner.temp }}/release.jks
          MOVINGDOTS_KEYSTORE_PASSWORD: ${{ secrets.MOVINGDOTS_KEYSTORE_PASSWORD }}
          MOVINGDOTS_KEY_ALIAS: ${{ secrets.MOVINGDOTS_KEY_ALIAS }}
          MOVINGDOTS_KEY_PASSWORD: ${{ secrets.MOVINGDOTS_KEY_PASSWORD }}
        run: ./gradlew testFullDebugUnitTest testFossDebugUnitTest assembleFullRelease assembleFossRelease

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/full/release/app-full-release.apk "dist/movingdots-$TAG-full.apk"
          cp app/build/outputs/apk/foss/release/app-foss-release.apk "dist/movingdots-$TAG-foss.apk"
          gh release create "$TAG" dist/*.apk --draft --verify-tag --title "Moving Dots $TAG" --generate-notes

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
